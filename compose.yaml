name: tracezilla-woocommerce-integration

services:
  php:
    build: .
    # Run as the host user so files written to the mounted project (vendor/,
    # var/, composer.lock) are not owned by root. Override with UID/GID if your
    # IDs are not 1000.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      HOME: /tmp
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  composer-cache:
