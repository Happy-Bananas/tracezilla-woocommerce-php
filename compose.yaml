name: tracezilla-woocommerce-integration

services:
  php:
    build: .
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  composer-cache:
