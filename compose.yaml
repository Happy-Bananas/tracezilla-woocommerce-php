# No fixed project name: Compose uses the folder name, so every project
# created with create-project gets its own containers.
services:
  php:
    build: .
    # Run as the host user so files written to the mounted project (vendor/,
    # var/, composer.lock) are not owned by root. create-project writes these
    # IDs to .env; without them, 1000 is used.
    user: "${TRACEZILLA_DOCKER_UID:-1000}:${TRACEZILLA_DOCKER_GID:-1000}"
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      HOME: /tmp
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  composer-cache:
