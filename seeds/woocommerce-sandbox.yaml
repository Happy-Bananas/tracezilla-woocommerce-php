# tracezilla development data for the WooCommerce sandbox.
#
# Apply it with:
#   docker compose run --rm php php bin/seed-tracezilla seeds/woocommerce-sandbox.yaml
#
# Field names below the identity keys are passed to the tracezilla API
# unchanged, so any field from https://app.tracezilla.com/api/documentation
# can be added. Records are identified by:
#   partners and locations  -> ref (own_company -> TRACEZILLA_OWN_COMPANY)
#   skus                    -> sku_code
#   purchase_orders         -> ext_ref
# Existing records are never updated; re-running the seed skips them.

version: 1

# The team's own company already exists in tracezilla. Its name differs per
# developer, so it is set with TRACEZILLA_OWN_COMPANY in .env. The seed only
# adds missing locations to it and never changes the company itself.
own_company:
  locations:
    - ref: TZ-WAREHOUSE-MAIN
      name: TZ Main warehouse
      is_warehouse: true
      address: Testvej 3
      zip: '8000'
      city: Aarhus C
      country: DK

partners:
  - ref: TZ-SUPPLIER
    name: TZ Supplier
    type: organization
    country: DK
    currency: DKK
    is_supplier: true
    locations:
      - ref: TZ-SUPPLIER-HQ
        name: TZ Supplier headquarters
        is_primary: true
        address: Testvej 1
        zip: '8000'
        city: Aarhus C
        country: DK

  - ref: TZ-WEBSHOP
    name: TZ Webshop
    type: organization
    country: DK
    currency: DKK
    is_customer: true
    locations:
      - ref: TZ-WEBSHOP-HQ
        name: TZ Webshop headquarters
        is_primary: true
        is_invoice_to: true
        address: Testvej 2
        zip: '8000'
        city: Aarhus C
        country: DK

# Matched SKUs cover every product used by the sandbox orders. The rest of the
# WooCommerce catalog (e.g. TZ-FRUIT-004) is deliberately missing, so the
# "create missing SKUs" workflow has something to do.
skus:
  - sku_code: TZ-FRUIT-001
    global_name: Fairtrade Bananas 1 kg
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 1
    weight_factor_gross: 1.05

  - sku_code: TZ-FRUIT-002
    global_name: Golden Pineapple
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 1.2
    weight_factor_gross: 1.25

  - sku_code: TZ-FRUIT-003
    global_name: Ripe Mango
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.4
    weight_factor_gross: 0.42

  # Variations of the WooCommerce product TZ-COFFEE-001.
  - sku_code: TZ-COFFEE-001-250G
    global_name: House Blend Coffee Beans 250 g
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.25
    weight_factor_gross: 0.28

  - sku_code: TZ-COFFEE-001-1KG
    global_name: House Blend Coffee Beans 1 kg
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 1
    weight_factor_gross: 1.05

  - sku_code: TZ-DAIRY-001
    global_name: Aged Gouda 500 g
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.5
    weight_factor_gross: 0.52

  # Sold per bottle, stored in crates of 12. Exposes unit-conversion handling.
  - sku_code: TZ-DAIRY-002
    global_name: Organic Whole Milk 1 L
    category: finished_good
    unit_of_measure: pcs
    lot_unit: colli
    default_uom_conversion: 12
    weight_factor_net: 1.03
    weight_factor_gross: 1.06

  # Exists only in tracezilla, for catalog difference reports. A raw material
  # measured in kg and stored in 25 kg sacks.
  - sku_code: TZ-RAW-001
    global_name: Raw Cocoa Beans 25 kg
    category: raw_material
    unit_of_measure: kg
    lot_unit: colli
    default_uom_conversion: 25
    weight_factor_net: 1
    weight_factor_gross: 1.02

# Received purchase orders put stock into the warehouse. Quantities differ from
# WooCommerce on purpose, so inventory synchronization has updates to report.
# TZ-FRUIT-003 is never received and stays at zero.
purchase_orders:
  - ext_ref: TZ-STOCK-001
    supplier: { partner: TZ-SUPPLIER, location: TZ-SUPPLIER-HQ }
    deliver_to: { partner: own_company, location: TZ-WAREHOUSE-MAIN }
    currency: DKK
    exchange_rate: 100
    receive: true
    lines:
      - { sku_code: TZ-FRUIT-001, quantity: 80, unit_price: 5, price_per: stock_unit }
      - { sku_code: TZ-FRUIT-002, quantity: 50, unit_price: 12, price_per: stock_unit }
      - { sku_code: TZ-COFFEE-001-250G, quantity: 10, unit_price: 20, price_per: stock_unit }
      - { sku_code: TZ-COFFEE-001-1KG, quantity: 15, unit_price: 70, price_per: stock_unit }
      - { sku_code: TZ-DAIRY-001, quantity: 21, unit_price: 20, price_per: stock_unit }
      - { sku_code: TZ-DAIRY-002, quantity: 2, unit_price: 96, price_per: lot_unit }
      - { sku_code: TZ-RAW-001, quantity: 4, unit_price: 60, price_per: stock_unit }
