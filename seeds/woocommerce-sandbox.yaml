# tracezilla development data for the WooCommerce sandbox.
#
# Apply it with:
#   docker compose run --rm php php bin/seed-tracezilla seeds/woocommerce-sandbox.yaml
#
# Field names below the identity keys are passed to the tracezilla API
# unchanged, so any field from https://app.tracezilla.com/api/documentation
# can be added. Records are identified by:
#   partners and locations  -> ref
#   skus                    -> sku_code
#   purchase_orders         -> ext_ref
# Existing records are never updated; re-running the seed skips them.

version: 1

partners:
  - ref: TZ-SUPPLIER
    name: TZ Supplier
    type: organization
    country: DK
    currency: DKK
    is_supplier: true
    locations:
      - ref: TZ-SUPPLIER-HQ
        name: TZ Supplier headquarters
        is_primary: true
        address: Testvej 1
        zip: '8000'
        city: Aarhus C
        country: DK

  - ref: TZ-WEBSHOP
    name: TZ Webshop
    type: organization
    country: DK
    currency: DKK
    is_customer: true
    locations:
      - ref: TZ-WEBSHOP-HQ
        name: TZ Webshop headquarters
        is_primary: true
        is_invoice_to: true
        address: Testvej 2
        zip: '8000'
        city: Aarhus C
        country: DK

  - ref: TZ-WAREHOUSE
    name: TZ Warehouse
    type: organization
    country: DK
    currency: DKK
    locations:
      - ref: TZ-WAREHOUSE-MAIN
        name: TZ Warehouse main
        is_primary: true
        is_warehouse: true
        address: Testvej 3
        zip: '8000'
        city: Aarhus C
        country: DK

# Matched SKUs cover every product used by the sandbox orders. TZ-CATALOG-003
# and the rest of the WooCommerce catalog are deliberately missing, so the
# "create missing SKUs" workflow has something to do.
skus:
  - sku_code: TZ-SIMPLE-001
    global_name: Tracezilla Test Banana
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.2
    weight_factor_gross: 0.25

  - sku_code: TZ-SALE-001
    global_name: Tracezilla Test Pineapple
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 1
    weight_factor_gross: 1.1

  - sku_code: TZ-OUT-OF-STOCK
    global_name: Tracezilla Test Mango
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.3
    weight_factor_gross: 0.35

  - sku_code: TZ-TSHIRT-S
    global_name: Tracezilla Test T-shirt Small
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.15
    weight_factor_gross: 0.2

  - sku_code: TZ-TSHIRT-M
    global_name: Tracezilla Test T-shirt Medium
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.17
    weight_factor_gross: 0.22

  - sku_code: TZ-CATALOG-001
    global_name: Tracezilla Catalog Product 001
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 0.5
    weight_factor_gross: 0.55

  # Sold per piece, stored in boxes of 12. Exposes unit-conversion handling.
  - sku_code: TZ-CATALOG-002
    global_name: Tracezilla Catalog Product 002
    category: finished_good
    unit_of_measure: pcs
    lot_unit: colli
    default_uom_conversion: 12
    weight_factor_net: 0.5
    weight_factor_gross: 0.55

  # Exists only in tracezilla, for catalog difference reports.
  - sku_code: TZ-TRACEZILLA-ONLY-001
    global_name: Tracezilla Only Product
    category: finished_good
    unit_of_measure: pcs
    lot_unit: pcs
    default_uom_conversion: 1
    weight_factor_net: 1
    weight_factor_gross: 1

# Received purchase orders put stock into the warehouse. Quantities differ from
# WooCommerce on purpose, so inventory synchronization has updates to report.
# TZ-OUT-OF-STOCK is never received and stays at zero.
purchase_orders:
  - ext_ref: TZ-STOCK-001
    supplier: { partner: TZ-SUPPLIER, location: TZ-SUPPLIER-HQ }
    deliver_to: { partner: TZ-WAREHOUSE, location: TZ-WAREHOUSE-MAIN }
    currency: DKK
    exchange_rate: 100
    receive: true
    lines:
      - { sku_code: TZ-SIMPLE-001, quantity: 80, unit_price: 5, price_per: stock_unit }
      - { sku_code: TZ-SALE-001, quantity: 50, unit_price: 12, price_per: stock_unit }
      - { sku_code: TZ-TSHIRT-S, quantity: 10, unit_price: 40, price_per: stock_unit }
      - { sku_code: TZ-TSHIRT-M, quantity: 15, unit_price: 40, price_per: stock_unit }
      - { sku_code: TZ-CATALOG-001, quantity: 21, unit_price: 20, price_per: stock_unit }
      - { sku_code: TZ-CATALOG-002, quantity: 2, unit_price: 240, price_per: lot_unit }
      - { sku_code: TZ-TRACEZILLA-ONLY-001, quantity: 5, unit_price: 10, price_per: stock_unit }
